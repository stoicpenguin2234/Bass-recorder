<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bass Studio Recorder</title>
  <style>
    :root {
      --bg: #121214;
      --panel: #1e1e24;
      --accent: #ff4d4d;
      --accent-hover: #e03e3e;
      --text: #f4f4f6;
      --muted: #9e9ea7;
      --meter-green: #2ecc71;
      --meter-yellow: #f1c40f;
      --meter-red: #e74c3c;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 900px;
      background: var(--panel);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { margin-top: 0; font-size: 1.35rem; display: flex; align-items: center; gap: 8px; }
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (min-width: 650px) {
      .controls-grid { grid-template-columns: 1fr 1fr; }
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #2a2a32;
      color: var(--text);
      font-size: 0.95rem;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    video#preview { width: 100%; height: 100%; object-fit: cover; }
    .rec-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(255, 77, 77, 0.92);
      color: white;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.8rem;
      display: none;
      align-items: center;
      gap: 6px;
    }
    .rec-dot {
      width: 8px; height: 8px; background: white; border-radius: 50%;
      animation: blink 1s infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .meter-container { margin-bottom: 16px; }
    .meter-bar-bg {
      width: 100%;
      height: 14px;
      background: #111;
      border-radius: 7px;
      overflow: hidden;
      border: 1px solid #333;
    }
    .meter-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--meter-green) 0%, var(--meter-yellow) 75%, var(--meter-red) 95%);
      transition: width 0.05s linear;
    }
    .audio-settings {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 18px;
      font-size: 0.9rem;
    }
    .audio-settings label { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; color: var(--text); line-height: 1.3; }
    .audio-settings input[type="checkbox"] { width: 18px; height: 18px; margin-top: 2px; flex-shrink: 0; }
    .action-bar { display: flex; gap: 10px; }
    button { cursor: pointer; font-weight: 600; border: none; transition: background 0.2s; }
    #btnStart { background: var(--accent); color: white; }
    #btnStart:hover:not(:disabled) { background: var(--accent-hover); }
    #btnStop { background: #444; color: white; }
    #btnPerm { background: #3498db; color: white; margin-bottom: 14px; display: none; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .status-msg { font-size: 0.85rem; color: #2ecc71; margin-top: 10px; display: none; }
    .downloads { margin-top: 20px; border-top: 1px solid #333; padding-top: 14px; }
    .take-item {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #25252d;
      padding: 12px 14px;
      border-radius: 8px;
      margin-top: 12px;
    }
    .take-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .take-player {
      width: 100%;
      border-radius: 6px;
      background: #000;
      max-height: 240px;
    }
    .take-actions { display: flex; gap: 8px; width: 100%; }
    .btn-save, .btn-share {
      flex: 1;
      padding: 10px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
      border: none;
    }
    .btn-save { background: #2ecc71; color: #111; display: inline-block; }
    .btn-share { background: #3498db; color: #fff; }
  </style>
</head>
<body>

<div class="container">
  <h1>🎸 Bass Studio Recorder</h1>

  <button id="btnPerm">🔓 Enable Camera & USB Audio</button>

  <div class="controls-grid">
    <div>
      <label for="videoSource">Camera Input</label>
      <select id="videoSource"></select>
    </div>
    <div>
      <label for="audioSource">USB Audio Interface / Mic</label>
      <select id="audioSource"></select>
    </div>
  </div>

  <div class="audio-settings">
    <label>
      <input type="checkbox" id="rawAudio" checked>
      <span><strong>Raw Instrument Mode</strong> (Disables voice filters so low bass strings record cleanly)</span>
    </label>
    <label>
      <input type="checkbox" id="monitorAudio">
      <span><strong>Direct Monitor</strong> (Headphones only — mute speakers to prevent feedback)</span>
    </label>
  </div>

  <div class="video-wrapper">
    <video id="preview" autoplay muted playsinline></video>
    <div class="rec-badge" id="recBadge"><div class="rec-dot"></div> REC <span id="timer">00:00</span></div>
  </div>

  <div class="meter-container">
    <label>Bass Input Level (Keep out of the red)</label>
    <div class="meter-bar-bg">
      <div class="meter-bar-fill" id="levelMeter"></div>
    </div>
  </div>

  <div class="action-bar">
    <button id="btnStart">● Record</button>
    <button id="btnStop" disabled>■ Stop</button>
  </div>

  <div class="status-msg" id="statusMsg"></div>

  <div class="downloads" id="downloadsSection" style="display:none;">
    <label>Recorded Takes</label>
    <div id="takesList"></div>
  </div>
</div>

<script>
  const videoSelect = document.getElementById('videoSource');
  const audioSelect = document.getElementById('audioSource');
  const rawAudioCheckbox = document.getElementById('rawAudio');
  const monitorCheckbox = document.getElementById('monitorAudio');
  const preview = document.getElementById('preview');
  const levelMeter = document.getElementById('levelMeter');
  const btnStart = document.getElementById('btnStart');
  const btnStop = document.getElementById('btnStop');
  const btnPerm = document.getElementById('btnPerm');
  const recBadge = document.getElementById('recBadge');
  const timerDisplay = document.getElementById('timer');
  const downloadsSection = document.getElementById('downloadsSection');
  const takesList = document.getElementById('takesList');
  const statusMsg = document.getElementById('statusMsg');

  let currentStream = null;
  let audioCtx = null;
  let analyser = null;
  let monitorGain = null;
  let mediaRecorder = null;
  let recordedChunks = [];
  let timerInterval = null;
  let secondsElapsed = 0;
  let takeCount = 0;

  function showStatus(text, isError = false) {
    statusMsg.textContent = text;
    statusMsg.style.color = isError ? '#ff4d4d' : '#2ecc71';
    statusMsg.style.display = 'block';
    setTimeout(() => { statusMsg.style.display = 'none'; }, 5000);
  }

  async function init() {
    try {
      const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
      tempStream.getTracks().forEach(track => track.stop());
      btnPerm.style.display = 'none';
      await populateDevices();
      await startStream();
    } catch (err) {
      btnPerm.style.display = 'block';
      showStatus('Tap "Enable Camera & USB Audio" above to grant hardware permissions.', true);
    }
  }

  btnPerm.addEventListener('click', init);

  async function populateDevices() {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const prevVideo = videoSelect.value;
    const prevAudio = audioSelect.value;
    videoSelect.innerHTML = '';
    audioSelect.innerHTML = '';

    devices.forEach(device => {
      const option = document.createElement('option');
      option.value = device.deviceId;
      if (device.kind === 'videoinput') {
        option.text = device.label || `Camera ${videoSelect.length + 1}`;
        videoSelect.appendChild(option);
      } else if (device.kind === 'audioinput') {
        option.text = device.label || `USB / Mic Input ${audioSelect.length + 1}`;
        audioSelect.appendChild(option);
      }
    });

    if (prevVideo) videoSelect.value = prevVideo;
    if (prevAudio) audioSelect.value = prevAudio;
  }

  async function startStream() {
    if (currentStream) {
      currentStream.getTracks().forEach(track => track.stop());
    }

    const isRaw = rawAudioCheckbox.checked;
    const constraints = {
      video: videoSelect.value
        ? { deviceId: { exact: videoSelect.value }, width: { ideal: 1280 }, height: { ideal: 720 } }
        : { facingMode: 'user' },
      audio: {
        deviceId: audioSelect.value ? { exact: audioSelect.value } : undefined,
        echoCancellation: !isRaw,
        noiseSuppression: !isRaw,
        autoGainControl: !isRaw,
        channelCount: 2,
        sampleRate: 48000
      }
    };

    try {
      currentStream = await navigator.mediaDevices.getUserMedia(constraints);
      preview.srcObject = currentStream;
      setupAudioMeter(currentStream);
    } catch (err) {
      showStatus('Device error: ' + err.message, true);
    }
  }

  function setupAudioMeter(stream) {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
