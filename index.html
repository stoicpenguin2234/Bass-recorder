<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bass Studio Recorder</title>
<link rel="manifest" href="manifest.json">
<style>
  * { box-sizing: border-box; font-family: sans-serif; }
  body { background: #121214; color: #f4f4f6; margin: 0; padding: 12px; }
  .box { max-width: 800px; margin: auto; background: #1e1e24; border-radius: 12px; padding: 16px; }
  h1 { margin: 0 0 12px; font-size: 1.3rem; }
  h2 { margin: 16px 0 8px; font-size: 1rem; color: #3498db; border-top: 1px solid #333; padding-top: 12px; }
  label { display: block; font-size: 0.85rem; color: #9e9ea7; margin: 10px 0 4px; }
  select, button, input[type="file"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #2a2a32; color: #fff; font-size: 0.95rem; }
  input[type="range"] { width: 100%; accent-color: #3498db; margin: 6px 0; }
  .vid-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; margin: 14px 0; }
  video#preview { width: 100%; height: 100%; object-fit: cover; }
  .rec { position: absolute; top: 10px; left: 10px; background: #ff4d4d; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; display: none; }
  .meter-bg { width: 100%; height: 14px; background: #111; border-radius: 7px; overflow: hidden; margin-bottom: 14px; }
  .meter-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #2ecc71, #f1c40f 75%, #e74c3c 95%); }
  .chk { display: flex; align-items: center; gap: 10px; margin: 10px 0; font-size: 0.9rem; color: #f4f4f6; }
  .chk input { width: 18px; height: 18px; }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  button { font-weight: bold; border: none; cursor: pointer; }
  #btnStart { background: #ff4d4d; }
  #btnStop { background: #444; }
  #btnPerm { background: #3498db; margin-bottom: 8px; }
  #btnSys { background: #9b59b6; margin-top: 6px; }
  #btnPlay { background: #2ecc71; color: #111; }
  button:disabled { opacity: 0.4; }
  #msg { font-size: 0.9rem; color: #2ecc71; margin: 8px 0; font-weight: bold; }
  .srow { display: flex; justify-content: space-between; font-size: 0.85rem; color: #ccc; margin-top: 8px; }
  .take { background: #25252d; padding: 12px; border-radius: 8px; margin-top: 12px; }
  .take video { width: 100%; border-radius: 6px; margin: 8px 0; max-height: 220px; background: #000; }
  .dl { display: inline-block; width: 100%; text-align: center; background: #2ecc71; color: #111; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold; }
</style>
</head>
<body>
<div class="box">
  <h1>🎸 Bass Studio Recorder</h1>
  <button id="btnPerm" type="button" onclick="connectAll()">🔄 Connect Camera &amp; Focusrite Scarlett</button>
  <div id="msg">Ready — tap Connect above to start.</div>
  <label for="cam">Camera Input</label>
  <select id="cam"></select>
  <label for="mic">USB Audio Interface / Input</label>
  <select id="mic"></select>
  <label class="chk"><input type="checkbox" id="raw" checked> Raw Instrument Mode (Clean Bass Tone)</label>
  <label class="chk"><input type="checkbox" id="mon"> Software Monitor (Headphones Only)</label>
  <div class="srow"><span>Bass Input Gain</span><span id="bTxt">100%</span></div>
  <input type="range" id="bVol" min="0" max="200" value="100">
  <div class="vid-wrap">
    <video id="preview" autoplay muted playsinline></video>
    <div class="rec" id="rec">● REC <span id="timer">00:00</span></div>
  </div>
  <label>Master Mix Input Level</label>
  <div class="meter-bg"><div class="meter-fill" id="meter"></div></div>
  <div class="row">
    <button id="btnStart" type="button">● Record Video + Mix</button>
    <button id="btnStop" type="button" disabled>■ Stop</button>
  </div>
  <h2>📡 Live App Audio Capture (YouTube / Tidal)</h2>
  <button id="btnSys" type="button">🎙️ Capture Device / App Audio</button>
  <div class="srow"><span>Captured App Audio Volume</span><span id="sTxt">80%</span></div>
  <input type="range" id="sVol" min="0" max="150" value="80">
  <h2>🎵 Local Backing Track File</h2>
  <input type="file" id="tFile" accept="audio/*">
  <audio id="bgAudio" loop></audio>
  <div class="srow"><span>Local File Volume</span><span id="tTxt">80%</span></div>
  <input type="range" id="tVol" min="0" max="150" value="80">
  <div class="row">
    <button id="btnPlay" type="button" disabled>▶ Play File</button>
    <button id="btnPause" type="button" disabled>■ Stop File</button>
  </div>
  <div id="takes"></div>
</div>
<script>
const $ = id => document.getElementById(id);
let stream, sysStream, ctx, analyser, bGain, mGain, sGain, tGain, tNode, mixDest, recObj, chunks = [], tInt, sec = 0, cnt = 0;

function say(txt, err) {
  $('msg').style.color = err ? '#ff4d4d' : '#2ecc71';
  $('msg').textContent = txt;
}

async function connectAll() {
  say('Requesting camera & USB audio access...', false);
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('Camera/Mic blocked. Open in Google Chrome.');
    }
    const s = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
    s.getTracks().forEach(t => t.stop());
    await loadDevs();
    await startStream();
    say('Devices connected!', false);
  } catch (e) {
    say('Error (' + e.name + '): ' + e.message, true);
  }
}

async function loadDevs() {
  const devs = await navigator.mediaDevices.enumerateDevices();
  const cv = $('cam').value, mv = $('mic').value;
  $('cam').innerHTML = ''; $('mic').innerHTML = '';
  devs.forEach(d => {
    const o = document.createElement('option');
    o.value = d.deviceId;
    if (d.kind === 'videoinput') { o.text = d.label || 'Camera ' + ($('cam').length + 1); $('cam').appendChild(o); }
    if (d.kind === 'audioinput') {
      o.text = d.label || 'USB / Mic ' + ($('mic').length + 1);
      $('mic').appendChild(o);
      if (d.label && d.label.toLowerCase().includes('scarlett')) $('mic').value = d.deviceId;
    }
  });
  if (cv) $('cam').value = cv;
  if (mv) $('mic').value = mv;
}

async function startStream() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  const r = $('raw').checked;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: $('cam').value ? { deviceId: { ideal: $('cam').value } } : { facingMode: 'user' },
      audio: { deviceId: $('mic').value ? { ideal: $('mic').value } : undefined, echoCancellation: !r, noiseSuppression: !r, autoGainControl: !r }
    });
    $('preview').srcObject = stream;
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = ctx.createAnalyser(); analyser.fftSize = 256;
      mixDest = ctx.createMediaStreamDestination();
      bGain = ctx.createGain(); mGain = ctx.createGain(); sGain = ctx.createGain(); tGain = ctx.createGain();
      bGain.connect(mixDest); bGain.connect(analyser); bGain.connect(mGain); mGain.connect(ctx.destination);
      sGain.connect(mixDest); sGain.connect(analyser);
      tGain.connect(mixDest); tGain.connect(analyser); tGain.connect(ctx.destination);
      const data = new Uint8Array(analyser.frequencyBinCount);
      (function draw() {
        analyser.getByteTimeDomainData(data);
        let p = 0;
        for (let i = 0; i < data.length; i++) { const v = Math.abs(data[i] - 128) / 128; if (v > p) p = v; }
        $('meter').style.width = Math.min(100, Math.round(p * 140)) + '%';
        requestAnimationFrame(draw);
      })();
    }
    if (ctx.state === 'suspended') await ctx.resume();
    bGain.gain.value = $('bVol').value / 100;
    mGain.gain.value = $('mon').checked ? 1 : 0;
    sGain.gain.value = $('sVol').value / 100;
    tGain.gain.value = $('tVol').value / 100;
    ctx.createMediaStreamSource(stream).connect(bGain);
  } catch (e) {
    say('Stream error (' + e.name + '): ' + e.message, true);
  }
}

$('btnSys').onclick = async () => {
  if (!ctx) await connectAll();
  try {
    if (sysStream) sysStream.getTracks().forEach(t => t.stop());
    sysStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
    const aTracks = sysStream.getAudioTracks();
    sysStream.getVideoTracks().forEach(t => t.stop());
    if (!aTracks.length) return say('No audio shared. Turn ON Share audio in prompt.', true);
    ctx.createMediaStreamSource(new MediaStream(aTracks)).connect(sGain);
    $('btnSys').textContent = '✅ App Audio Connected';
    say('App audio linked!', false);
  } catch (e) { say('App audio error: ' + e.message, true); }
};

$('bVol').oninput = () => { $('bTxt').textContent = $('bVol').value + '%'; if (bGain) bGain.gain.value = $('bVol').value / 100; };
$('sVol').oninput = () => { $('sTxt').textContent = $('sVol').value + '%'; if (sGain) sGain.gain.value = $('sVol').value / 100; };
$('tVol').oninput = () => { $('tTxt').textContent = $('tVol').value + '%'; if (tGain) tGain.gain.value = $('tVol').value / 100; };

$('tFile').onchange = () => {
  const f = $('tFile').files.item(0);
  if (!f) return;
  $('bgAudio').src = URL.createObjectURL(f);
  $('btnPlay').disabled = false; $('btnPause').disabled = false;
  say('Loaded track: ' + f.name, false);
};

$('btnPlay').onclick = async () => {
  if (!ctx) await connectAll();
  if (ctx && !tNode) { tNode = ctx.createMediaElementSource($('bgAudio')); tNode.connect(tGain); }
  $('bgAudio').play();
};
$('btnPause').onclick = () => { $('bgAudio').pause(); $('bgAudio').currentTime = 0; };

$('btnStart').onclick = () => {
  if (!stream || !mixDest) return;
  chunks = [];
  const comb = new MediaStream([...stream.getVideoTracks(), ...mixDest.stream.getAudioTracks()]);
  const mime = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
  recObj = new MediaRecorder(comb, { mimeType: mime, audioBitsPerSecond: 256000 });
  recObj.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  recObj.onstop = () => {
    cnt++;
    const ext = mime.includes('mp4') ? 'mp4' : 'webm';
    const url = URL.createObjectURL(new Blob(chunks, { type: mime }));
    const d = document.createElement('div'); d.className = 'take';
    const title = document.createElement('strong'); title.textContent = 'Take #' + cnt + ' (' + $('timer').textContent + ')';
    const vid = document.createElement('video'); vid.controls = true; vid.playsInline = true; vid.src = url;
    const link = document.createElement('a'); link.className = 'dl'; link.href = url; link.download = 'Bass_Mix_' + cnt + '.' + ext; link.textContent = '⬇ Download Video';
    d.append(title, vid, link);
    $('takes').prepend(d);
  };
  recObj.start(250);
  if ($('bgAudio').src && $('bgAudio').paused) $('bgAudio').play();
  $('btnStart').disabled = true; $('btnStop').disabled = false; $('cam').disabled = true; $('mic').disabled = true;
  $('rec').style.display = 'block'; sec = 0; $('timer').textContent = '00:00';
  tInt = setInterval(() => { sec++; $('timer').textContent = String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0'); }, 1000);
};

$('btnStop').onclick = () => {
  if (recObj && recObj.state !== 'inactive') recObj.stop();
  $('bgAudio').pause(); clearInterval(tInt);
  $('btnStart').disabled = false; $('btnStop').disabled = true; $('cam').disabled = false; $('mic').disabled = false;
  $('rec').style.display = 'none';
};

$('cam').onchange = startStream; $('mic').onchange = startStream; $('raw').onchange = startStream;
$('mon').onchange = () => { if (mGain) mGain.gain.value = $('mon').checked ? 1 : 0; };
navigator.mediaDevices.ondevicechange = async () => { await loadDevs(); await startStream(); };
</script>
</body>
</html>
