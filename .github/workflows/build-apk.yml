name: Build Bass Studio APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Capacitor Android
        run: |
          npm install
          npx cap init "Bass Studio" "com.bassstudio.recorder" --web-dir www
          npx cap add android

      - name: Inject Native Permissions & Plugins
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />\n    <uses-feature android:name="android.hardware.usb.host" />\n    <application|' android/app/src/main/AndroidManifest.xml

          sed -i 's|</application>|    <service android:name=".AudioCaptureService" android:foregroundServiceType="mediaProjection" android:exported="false" />\n    </application>|' android/app/src/main/AndroidManifest.xml

          cat << 'EOF' > android/app/src/main/java/com/bassstudio/recorder/AudioCaptureService.java
          package com.bassstudio.recorder;
          import android.app.*;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.*;
          public class AudioCaptureService extends Service {
              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel("cap", "Audio Capture", NotificationManager.IMPORTANCE_LOW);
                      getSystemService(NotificationManager.class).createNotificationChannel(ch);
                      Notification n = new Notification.Builder(this, "cap").setContentTitle("Bass Studio Audio Active").setSmallIcon(android.R.drawable.ic_btn_speak_now).build();
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
                      } else {
                          startForeground(1, n);
                      }
                  }
                  return START_NOT_STICKY;
              }
              @Override public IBinder onBind(Intent intent) { return null; }
          }
          EOF

          cat << 'EOF' > android/app/src/main/java/com/bassstudio/recorder/SystemAudioPlugin.java
          package com.bassstudio.recorder;
          import android.app.Activity;
          import android.content.*;
          import android.media.*;
          import android.media.projection.*;
          import android.os.Build;
          import android.util.Base64;
          import androidx.activity.result.ActivityResult;
          import com.getcapacitor.*;
          import com.getcapacitor.annotation.*;

          @CapacitorPlugin(name = "SystemAudio")
          public class SystemAudioPlugin extends Plugin {
              private MediaProjection mediaProjection;
              private AudioRecord audioRecord;
              private boolean isCapturing = false;

              @PluginMethod
              public void startCapture(PluginCall call) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                      call.reject("Requires Android 10+");
                      return;
                  }
                  MediaProjectionManager mpm = (MediaProjectionManager) getContext().getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                  startActivityForResult(call, mpm.createScreenCaptureIntent(), "onCaptureResult");
              }

              @ActivityCallback
              private void onCaptureResult(PluginCall call, ActivityResult result) {
                  if (result.getResultCode() != Activity.RESULT_OK || result.getData() == null) {
                      call.reject("Permission denied");
                      return;
                  }
                  Intent svc = new Intent(getContext(), AudioCaptureService.class);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) getContext().startForegroundService(svc);
                  else getContext().startService(svc);

                  MediaProjectionManager mpm = (MediaProjectionManager) getContext().getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                  mediaProjection = mpm.getMediaProjection(result.getResultCode(), result.getData());

                  AudioPlaybackCaptureConfiguration config = new AudioPlaybackCaptureConfiguration.Builder(mediaProjection)
                      .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                      .addMatchingUsage(AudioAttributes.USAGE_GAME)
                      .build();

                  AudioFormat format = new AudioFormat.Builder()
                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                      .setSampleRate(48000)
                      .setChannelMask(AudioFormat.CHANNEL_IN_MONO)
                      .build();

                  int bufSize = AudioRecord.getMinBufferSize(48000, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT) * 2;
                  audioRecord = new AudioRecord.Builder()
                      .setAudioFormat(format)
                      .setBufferSizeInBytes(bufSize)
                      .setAudioPlaybackCaptureConfig(config)
                      .build();

                  audioRecord.startRecording();
                  isCapturing = true;
                  new Thread(() -> {
                      byte[] buf = new byte;
                      while (isCapturing && audioRecord != null) {
                          int read = audioRecord.read(buf, 0, buf.length);
                          if (read > 0) {
                              String b64 = Base64.encodeToString(buf, 0, read, Base64.NO_WRAP);
                              getActivity().runOnUiThread(() -> bridge.eval("if(window.onAndroidAudioChunk) window.onAndroidAudioChunk('" + b64 + "');", null));
                          }
                      }
                  }).start();
                  call.resolve();
              }

              @PluginMethod
              public void stopCapture(PluginCall call) {
                  isCapturing = false;
                  if (audioRecord != null) { audioRecord.stop(); audioRecord.release(); audioRecord = null; }
                  if (mediaProjection != null) { mediaProjection.stop(); mediaProjection = null; }
                  getContext().stopService(new Intent(getContext(), AudioCaptureService.class));
                  call.resolve();
              }
          }
          EOF
          cat << 'EOF' > android/app/src/main/java/com/bassstudio/recorder/SaveVideoPlugin.java
          package com.bassstudio.recorder;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import com.getcapacitor.*;
          import com.getcapacitor.annotation.*;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "SaveVideo")
          public class SaveVideoPlugin extends Plugin {
              @PluginMethod
              public void saveToDownloads(PluginCall call) {
                  String b64 = call.getString("data");
                  String filename = call.getString("filename", "Bass_Mix.mp4");
                  String mime = call.getString("mime", "video/mp4");
                  if (b64 == null) { call.reject("No data"); return; }
                  try {
                      byte[] bytes = Base64.decode(b64, Base64.DEFAULT);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          ContentValues cv = new ContentValues();
                          cv.put(MediaStore.Downloads.DISPLAY_NAME, filename);
                          cv.put(MediaStore.Downloads.MIME_TYPE, mime);
                          cv.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                          Uri uri = getContext().getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                          try (OutputStream os = getContext().getContentResolver().openOutputStream(uri)) {
                              os.write(bytes);
                          }
                      } else {
                          File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                          File out = new File(dir, filename);
                          try (FileOutputStream fos = new FileOutputStream(out)) {
                              fos.write(bytes);
                          }
                      }
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("Save failed: " + e.getMessage());
                  }
              }
          }
          EOF

          cat << 'EOF' > android/app/src/main/java/com/bassstudio/recorder/MainActivity.java
          package com.bassstudio.recorder;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SystemAudioPlugin.class);
                  registerPlugin(SaveVideoPlugin.class);
                  super.onCreate(savedInstanceState);
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED ||
                      ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{
                          Manifest.permission.CAMERA,
                          Manifest.permission.RECORD_AUDIO
                      }, 101);
                  }
                  this.bridge.getWebView().setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> request.grant(request.getResources()));
                      }
                  });
              }
          }
          EOF

      - name: Build APK
        run: |
          npx cap sync
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bass-Studio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
