<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bass Studio Recorder</title>
<style>
  * { box-sizing: border-box; font-family: sans-serif; }
  body { background: #121214; color: #f4f4f6; margin: 0; padding: 12px; }
  .box { max-width: 800px; margin: auto; background: #1e1e24; border-radius: 12px; padding: 16px; }
  h1 { margin: 0 0 12px; font-size: 1.3rem; }
  h2 { margin: 16px 0 8px; font-size: 1rem; color: #3498db; border-top: 1px solid #333; padding-top: 12px; }
  label { display: block; font-size: 0.85rem; color: #9e9ea7; margin: 10px 0 4px; }
  select, button, input[type="file"], input[type="number"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #2a2a32; color: #fff; font-size: 0.95rem; }
  input[type="range"] { width: 100%; accent-color: #3498db; margin: 6px 0; }
  .vid-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; margin: 14px 0; }
  video#preview { width: 100%; height: 100%; object-fit: cover; }
  .rec { position: absolute; top: 10px; left: 10px; background: #ff4d4d; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; display: none; }
  .meter-bg { width: 100%; height: 14px; background: #111; border-radius: 7px; overflow: hidden; margin-bottom: 14px; }
  .meter-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #2ecc71, #f1c40f 75%, #e74c3c 95%); }
  .chk { display: flex; align-items: center; gap: 10px; margin: 10px 0; font-size: 0.9rem; color: #f4f4f6; }
  .chk input { width: 18px; height: 18px; }
  .row { display: flex; gap: 10px; margin-top: 10px; align-items: center; }
  button { font-weight: bold; border: none; cursor: pointer; }
  #btnStart { background: #ff4d4d; }
  #btnStop { background: #444; }
  #btnPerm { background: #3498db; margin-bottom: 8px; }
  #btnSys { background: #9b59b6; }
  #btnPlay, #btnMet { background: #2ecc71; color: #111; }
  button:disabled { opacity: 0.4; }
  #msg { font-size: 0.9rem; color: #2ecc71; margin: 8px 0; font-weight: bold; }
  .srow { display: flex; justify-content: space-between; font-size: 0.85rem; color: #ccc; margin-top: 8px; }
  .led { width: 22px; height: 22px; border-radius: 50%; background: #333; flex-shrink: 0; border: 2px solid #555; }
  .led.on { background: #2ecc71; box-shadow: 0 0 10px #2ecc71; }
  .led.accent { background: #ff4d4d; box-shadow: 0 0 12px #ff4d4d; }
  .take { background: #25252d; padding: 12px; border-radius: 8px; margin-top: 12px; }
  .take video { width: 100%; border-radius: 6px; margin: 8px 0; max-height: 220px; background: #000; }
  .dl { display: inline-block; width: 100%; text-align: center; background: #2ecc71; color: #111; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 0.95rem; }
</style>
</head>
<body>
<div class="box">
  <h1>🎸 Bass Studio Recorder</h1>
  <button id="btnPerm" type="button" onclick="connectAll()">🔄 Connect Camera &amp; Focusrite Scarlett</button>
  <div id="msg">Ready — tap Connect above to start.</div>

  <label for="cam">Camera Input</label>
  <select id="cam">
    <option value="user">Front Camera (Selfie)</option>
    <option value="environment">Rear Main Camera</option>
  </select>

  <label for="mic">USB Audio Interface / Input</label>
  <select id="mic"></select>

  <label class="chk"><input type="checkbox" id="raw" checked> Raw Instrument Mode (Auto-enabled on USB Scarlett)</label>
  <label class="chk"><input type="checkbox" id="mon"> Software Monitor (Headphones Only)</label>

  <div class="srow"><span>Bass Input Gain</span><span id="bTxt">100%</span></div>
  <input type="range" id="bVol" min="0" max="200" value="100">

  <div class="vid-wrap">
    <video id="preview" autoplay muted playsinline></video>
    <div class="rec" id="rec">● REC <span id="timer">00:00</span></div>
  </div>

  <label>Master Mix Input Level</label>
  <div class="meter-bg"><div class="meter-fill" id="meter"></div></div>

  <div class="row">
    <button id="btnStart" type="button">● Record Video + Mix</button>
    <button id="btnStop" type="button" disabled>■ Stop</button>
  </div>

  <h2>📡 Android Internal Audio (Songsterr / Apps)</h2>
  <button id="btnSys" type="button">🎙️ Start Android Internal Audio</button>
  <div class="srow"><span>Internal Audio Volume</span><span id="sTxt">80%</span></div>
  <input type="range" id="sVol" min="0" max="150" value="80">

  <h2>⏱️ Studio Metronome</h2>
  <div class="row">
    <div class="led" id="led"></div>
    <input type="number" id="bpm" min="40" max="240" value="100" style="width: 100px;">
    <button id="btnMet" type="button">▶ Start Click</button>
  </div>
  <div class="srow"><span>Metronome Volume</span><span id="mTxt">70%</span></div>
  <input type="range" id="mVol" min="0" max="150" value="70">
  <label class="chk"><input type="checkbox" id="recMet"> Record Metronome Click into Video</label>

  <h2>🎵 Local Backing Track File</h2>
  <input type="file" id="tFile" accept="audio/*">
  <audio id="bgAudio" loop></audio>
  <div class="srow"><span>Local File Volume</span><span id="tTxt">80%</span></div>
  <input type="range" id="tVol" min="0" max="150" value="80">
  <div class="row">
    <button id="btnPlay" type="button" disabled>▶ Play</button>
    <button id="btnPause" type="button" disabled>⏮ Restart</button>
  </div>

  <div id="takes"></div>
</div>
<script>
const $ = id => document.getElementById(id);
let audStream, vidStream, ctx, analyser, bGain, mGain, sGain, tGain, metGain, tNode, mixDest, recObj, chunks = [];
let tInt, sec = 0, cnt = 0, metInt = null, beat = 0, sysActive = false, nextPlayTime = 0, micSrcNode = null;

function say(txt, err) {
  $('msg').style.color = err ? '#ff4d4d' : '#2ecc71';
  $('msg').textContent = txt;
}

function setPlayBtn(isPlaying) {
  $('btnPlay').textContent = isPlaying ? '⏸ Pause' : '▶ Play';
  $('btnPlay').style.background = isPlaying ? '#f1c40f' : '#2ecc71';
}

function setupAudio() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
    analyser = ctx.createAnalyser(); analyser.fftSize = 256;
    mixDest = ctx.createMediaStreamDestination();
    bGain = ctx.createGain(); mGain = ctx.createGain(); sGain = ctx.createGain(); tGain = ctx.createGain(); metGain = ctx.createGain();

    bGain.connect(mixDest); bGain.connect(analyser); bGain.connect(mGain); mGain.connect(ctx.destination);
    sGain.connect(mixDest); sGain.connect(analyser);
    tGain.connect(mixDest); tGain.connect(analyser); tGain.connect(ctx.destination);
    metGain.connect(ctx.destination);
    if ($('recMet').checked) metGain.connect(mixDest);

    const data = new Uint8Array(analyser.frequencyBinCount);
    (function draw() {
      analyser.getByteTimeDomainData(data);
      let p = 0;
      for (let i = 0; i < data.length; i++) { const v = Math.abs(data[i] - 128) / 128; if (v > p) p = v; }
      $('meter').style.width = Math.min(100, Math.round(p * 140)) + '%';
      requestAnimationFrame(draw);
    })();
  }
  if (ctx.state === 'suspended') ctx.resume();
  bGain.gain.value = $('bVol').value / 100;
  mGain.gain.value = $('mon').checked ? 1 : 0;
  sGain.gain.value = $('sVol').value / 100;
  tGain.gain.value = $('tVol').value / 100;
  metGain.gain.value = $('mVol').value / 100;
}

async function connectAll() {
  say('Connecting Focusrite Scarlett & Camera...', false);
  await startAudio();
  await startVideo();
}

async function loadMics() {
  const devs = await navigator.mediaDevices.enumerateDevices();
  const mv = $('mic').value;
  $('mic').innerHTML = '';
  devs.forEach(d => {
    if (d.kind === 'audioinput') {
      const o = document.createElement('option');
      o.value = d.deviceId;
      o.text = d.label || 'USB / Mic ' + ($('mic').length + 1);
      $('mic').appendChild(o);
      if (d.label && d.label.toLowerCase().includes('scarlett')) $('mic').value = d.deviceId;
    }
  });
  if (mv && [...$('mic').options].some(o => o.value === mv)) $('mic').value = mv;
}

async function startAudio() {
  if (audStream) audStream.getTracks().forEach(t => t.stop());
  const selectedOpt = $('mic').options.item($('mic').selectedIndex);
  const selectedLabel = selectedOpt ? selectedOpt.text.toLowerCase() : '';
  const isUsb = selectedLabel.includes('scarlett') || selectedLabel.includes('usb');
  const useRaw = $('raw').checked && isUsb;
  try {
    audStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        deviceId: $('mic').value ? { ideal: $('mic').value } : undefined,
        echoCancellation: !useRaw,
        noiseSuppression: !useRaw,
        autoGainControl: !useRaw
      }
    });
    await loadMics();
    setupAudio();
    if (micSrcNode) { try { micSrcNode.disconnect(); } catch (e) {} }
    micSrcNode = ctx.createMediaStreamSource(audStream);
    micSrcNode.connect(bGain);
    say(isUsb ? 'USB Interface connected (Raw Bass Mode)!' : 'Phone Mic connected (Echo Cancellation ON)!', false);
  } catch (e) {
    say('Audio error (' + e.name + '): ' + e.message, true);
  }
}

async function startVideo() {
  if (vidStream) vidStream.getTracks().forEach(t => t.stop());
  const mode = $('cam').value || 'user';
  try {
    vidStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: mode } }
    });
    $('preview').srcObject = vidStream;
    say('Camera & Audio connected!', false);
  } catch (e) {
    say('Camera warning (' + e.name + '): Audio still works! Try switching Front/Rear camera.', true);
  }
}
window.onAndroidAudioChunk = function(b64) {
  if (!sysActive || !ctx) return;
  const bin = atob(b64);
  const len = bin.length / 2;
  const f32 = new Float32Array(len);
  for (let i = 0; i < len; i++) {
    let val = (bin.charCodeAt(i * 2) | (bin.charCodeAt(i * 2 + 1) << 8));
    if (val >= 32768) val -= 65536;
    f32[i] = val / 32768.0;
  }
  const buf = ctx.createBuffer(1, len, 48000);
  buf.getChannelData(0).set(f32);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(sGain);
  if (nextPlayTime < ctx.currentTime) nextPlayTime = ctx.currentTime + 0.02;
  src.start(nextPlayTime);
  nextPlayTime += buf.duration;
};

$('btnSys').onclick = async () => {
  setupAudio();
  const Plugin = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SystemAudio;
  if (!Plugin) return say('Native Android APK required for internal audio capture.', true);
  if (!sysActive) {
    try {
      await Plugin.startCapture();
      sysActive = true; nextPlayTime = ctx.currentTime;
      $('btnSys').textContent = '⏹ Stop Android Internal Audio';
      $('btnSys').style.background = '#e74c3c';
      say('Capturing Android internal audio!', false);
    } catch (e) { say('Internal audio error: ' + e.message, true); }
  } else {
    await Plugin.stopCapture();
    sysActive = false;
    $('btnSys').textContent = '🎙️ Start Android Internal Audio';
    $('btnSys').style.background = '#9b59b6';
    say('Stopped internal audio capture.', false);
  }
};

function playClick() {
  setupAudio();
  const osc = ctx.createOscillator(), env = ctx.createGain();
  const isAccent = (beat % 4 === 0);
  osc.frequency.value = isAccent ? 1000 : 750;
  env.gain.setValueAtTime(0.6, ctx.currentTime);
  env.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
  osc.connect(env); env.connect(metGain);
  osc.start(); osc.stop(ctx.currentTime + 0.05);
  $('led').className = isAccent ? 'led accent' : 'led on';
  setTimeout(() => { $('led').className = 'led'; }, 100);
  beat++;
}

$('btnMet').onclick = () => {
  if (metInt) {
    clearInterval(metInt); metInt = null;
    $('btnMet').textContent = '▶ Start Click'; $('btnMet').style.background = '#2ecc71';
  } else {
    const val = Math.min(240, Math.max(40, parseInt($('bpm').value) || 100));
    $('bpm').value = val; beat = 0; playClick();
    metInt = setInterval(playClick, 60000 / val);
    $('btnMet').textContent = '■ Stop Click'; $('btnMet').style.background = '#ff4d4d';
  }
};

$('bpm').onchange = () => { if (metInt) { $('btnMet').click(); $('btnMet').click(); } };
$('recMet').onchange = () => {
  if (!metGain || !mixDest) return;
  try { metGain.disconnect(mixDest); } catch (e) {}
  if ($('recMet').checked) metGain.connect(mixDest);
};

$('bVol').oninput = () => { $('bTxt').textContent = $('bVol').value + '%'; if (bGain) bGain.gain.value = $('bVol').value / 100; };
$('sVol').oninput = () => { $('sTxt').textContent = $('sVol').value + '%'; if (sGain) sGain.gain.value = $('sVol').value / 100; };
$('mVol').oninput = () => { $('mTxt').textContent = $('mVol').value + '%'; if (metGain) metGain.gain.value = $('mVol').value / 100; };
$('tVol').oninput = () => { $('tTxt').textContent = $('tVol').value + '%'; if (tGain) tGain.gain.value = $('tVol').value / 100; };

$('tFile').onchange = () => {
  const f = $('tFile').files.item(0);
  if (!f) return;
  $('bgAudio').src = URL.createObjectURL(f);
  $('btnPlay').disabled = false; $('btnPause').disabled = false; setPlayBtn(false);
  say('Loaded track: ' + f.name, false);
};

$('btnPlay').onclick = () => {
  setupAudio();
  if (!tNode) { tNode = ctx.createMediaElementSource($('bgAudio')); tNode.connect(tGain); }
  const a = $('bgAudio');
  if (a.paused) { a.play(); setPlayBtn(true); } else { a.pause(); setPlayBtn(false); }
};

$('btnPause').onclick = () => { const a = $('bgAudio'); a.pause(); a.currentTime = 0; setPlayBtn(false); };

$('btnStart').onclick = () => {
  if (!mixDest) return;
  chunks = [];
  const tracks = [...mixDest.stream.getAudioTracks()];
  if (vidStream) tracks.push(...vidStream.getVideoTracks());
  const comb = new MediaStream(tracks);
  const mp4Type = 'video/mp4;codecs=avc1,mp4a.40.2';
  const mime = MediaRecorder.isTypeSupported(mp4Type) ? mp4Type : 'video/webm';
  const cleanMime = mime.includes('mp4') ? 'video/mp4' : 'video/webm';
  recObj = new MediaRecorder(comb, { mimeType: mime, audioBitsPerSecond: 256000 });
  recObj.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  recObj.onstop = () => {
    cnt++;
    const ext = cleanMime.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(chunks, { type: cleanMime });
    const url = URL.createObjectURL(blob);
    const fname = 'Bass_Mix_' + cnt + '.' + ext;
    const d = document.createElement('div'); d.className = 'take';
    const title = document.createElement('strong'); title.textContent = 'Take #' + cnt + ' (' + $('timer').textContent + ')';
    const vid = document.createElement('video'); vid.controls = true; vid.playsInline = true; vid.src = url;
    const btnSave = document.createElement('button'); btnSave.className = 'dl'; btnSave.type = 'button'; btnSave.textContent = '💾 Save Video to Phone';
    btnSave.onclick = () => {
      btnSave.textContent = '⏳ Saving...';
      const reader = new FileReader();
      reader.onloadend = async () => {
        const b64 = reader.result.split(',').slice(1).join(',');
        const Saver = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SaveVideo;
        if (Saver) {
          try {
            await Saver.saveToDownloads({ data: b64, filename: fname, mime: cleanMime });
            btnSave.textContent = '✅ Saved to Downloads!';
            say('Saved ' + fname + ' to Downloads folder!', false);
          } catch (err) { btnSave.textContent = '❌ Save Failed'; say('Save error: ' + err.message, true); }
        } else { const a = document.createElement('a'); a.href = url; a.download = fname; a.click(); }
      };
      reader.readAsDataURL(blob);
    };
    d.append(title, vid, btnSave);
    $('takes').prepend(d);
  };
  recObj.start(250);
  if ($('bgAudio').src && $('bgAudio').paused) {
    setupAudio();
    if (!tNode) { tNode = ctx.createMediaElementSource($('bgAudio')); tNode.connect(tGain); }
    $('bgAudio').play(); setPlayBtn(true);
  }
  $('btnStart').disabled = true; $('btnStop').disabled = false; $('cam').disabled = true; $('mic').disabled = true;
  $('rec').style.display = 'block'; sec = 0; $('timer').textContent = '00:00';
  tInt = setInterval(() => { sec++; $('timer').textContent = String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0'); }, 1000);
};

$('btnStop').onclick = () => {
  if (recObj && recObj.state !== 'inactive') recObj.stop();
  $('bgAudio').pause(); setPlayBtn(false); clearInterval(tInt);
  $('btnStart').disabled = false; $('btnStop').disabled = true; $('cam').disabled = false; $('mic').disabled = false;
  $('rec').style.display = 'none';
};

$('cam').onchange = startVideo;
$('mic').onchange = startAudio;
$('raw').onchange = startAudio;
$('mon').onchange = () => { if (mGain) mGain.gain.value = $('mon').checked ? 1 : 0; };
navigator.mediaDevices.ondevicechange = async () => { await loadMics(); };
</script>
</body>
</html>
